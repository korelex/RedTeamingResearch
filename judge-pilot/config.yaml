versions:
  agentdojo: "0.1.35"
  google-genai: "2.31.0"

benchmark_version: v1.2

vertex:
  location: us-central1
  flash_model: gemini-2.5-flash
  pro_model: gemini-2.5-pro  # second agent model for the Flash vs Pro comparison
  flash38_model: gemini-3.8-flash  # newer-generation comparison (2026-10-21)
  pro31_model: gemini-3.1-pro-preview
  # Location per model where it differs from GOOGLE_CLOUD_LOCATION (.env). Gemini 3.x returns 404 in us-central1.
  model_locations:
    gemini-3.8-flash: global
    gemini-3.1-pro-preview: global
  # Models whose function-call thought_signatures are sent back on later turns (required by Gemini 3.x; see runner).
  preserve_thought_signatures: [gemini-3.8-flash, gemini-3.1-pro-preview]
  # Sent on every generate_content call (GoogleLLM default is also 0.0). The runner logs the value
  # read back from the GenerateContentConfig that was actually sent.
  temperature: 0.0
  # Injected into GenerateContentConfig.seed by the runner's client wrapper (GoogleLLM does not set one).
  seed: 1234
  # Per-request HTTP timeout (GenerateContentConfig.http_options.timeout). Timeouts are retried.
  request_timeout_s: 180

# Prices in USD per million tokens. Thinking tokens are counted as output.
pricing:
  gemini-2.5-flash:  # CONFIRMED from Billing SKUs 2026-10-21 (₹28.79 / ₹239.98 per 1M at ₹96/$)
    input_per_mtok: 0.30
    output_per_mtok: 2.50
  gemini-2.5-pro:  # CONFIRMED from Billing SKUs 2026-10-21 (<= 200k tier; ₹119.99 / ₹959.88 per 1M at ₹96/$)
    input_per_mtok: 1.25
    output_per_mtok: 10.00
  gemini-3.1-pro-preview:  # CONFIRMED 2026-10-27 from Billing SKUs (₹746.11 / ₹1,341.02 at ₹96 per $)
    input_per_mtok: 2.00
    output_per_mtok: 12.00
  # gemini-3.8-flash is also an agent model since 2026-10-21. Derived from Billing SKUs 2026-10-21 (₹96/$).
  # Cached input is billed at 10% of input; project_usage cannot see cached tokens, so its estimates are upper bounds.
  gemini-3.8-flash:  # global; cached input 0.15
    input_per_mtok: 1.50
    output_per_mtok: 7.50
  gemini-3-flash-preview:  # cached input 0.05
    input_per_mtok: 0.50
    output_per_mtok: 3.00
  openai/gpt-oss-120b-maas:  # Google's GA announcement (discuss.google.dev); trackers list 0.09/0.36. Confirm in Billing.
    input_per_mtok: 0.15
    output_per_mtok: 0.60
  meta/llama-4-maverick-17b-128e-instruct-maas:  # CONFIRMED 2026-10-27 from Billing SKUs (₹86.05 / ₹21.81 at ₹96 per $)
    input_per_mtok: 0.35
    output_per_mtok: 1.15

# Who is likely behind each model's usage in korelex-ai-lab (for src/project_usage.py). Guesses, not audit data.
usage_owners:
  gemini-2.5-flash: Manish (judge-pilot runs)
  gemini-2.5-pro: Manish (judge-pilot runs)
  gemini-3.8-flash: Rhit (possible) / Manish (pilot, from 2026-10-21)
  gemini-3-flash-preview: Rhit (possible)
  default: Manish/Rhit (unknown)

spend_cap_usd: 70.0  # scale-up Stage 2 (PREREGISTRATION_SCALEUP.md §8; was 62.0); cumulative over all data/runs
concurrency: 4

# Slower settings for Gemini 3.x plans (shared-capacity 429s on the global endpoint).
gemini3_throttle: &gemini3_throttle
  concurrency: 2
  retry: {max_tries: 10, base_delay_s: 5.0, max_delay_s: 120.0}

# Transient Vertex errors (5xx, 429, 408, timeouts, connection errors): exponential backoff with jitter.
retry:
  max_tries: 5
  base_delay_s: 2.0
  max_delay_s: 60.0

plans:
  # Plans run gemini-2.5-flash (vertex.flash_model) unless they set `model: <key under vertex:>`.
  smoke: &smoke
    suites: [banking, slack]
    attacks: [important_instructions]
    repeats: 1
    baseline_count: 1  # round-robin over suites -> banking user_task_0
    pairs:
      - {suite: banking, user_task: user_task_0, injection_task: injection_task_0}
      - {suite: banking, user_task: user_task_2, injection_task: injection_task_1}
      - {suite: banking, user_task: user_task_4, injection_task: injection_task_3}
      - {suite: slack, user_task: user_task_1, injection_task: injection_task_1}
      - {suite: slack, user_task: user_task_4, injection_task: injection_task_2}
  night1: &night1  # user-confirmed 2026-10-20 (Checkpoint 4): 142 runs
    suites: [banking, slack]
    attacks: [important_instructions]
    repeats: 2
    baseline_count: 10
    # baseline_repeats defaults to `repeats`
    sampling: {rule: stratified_per_injection, k: {banking: 4, slack: 5}, seed: 0}
  # Same runs as smoke / night1 on gemini-2.5-pro (run_id includes model_id, so lines never collide).
  smoke_pro:
    <<: *smoke
    model: pro_model
  night1_pro:
    <<: *night1
    model: pro_model
  # Newer generation (user "go new models", 2026-10-21). Smoke at both temperatures, then one night plan per model.
  # Gemini 3.x on the global endpoint hits shared-capacity 429s, so these plans use fewer workers and longer backoff.
  # Runs at a temperature other than vertex.temperature get run_ids keyed model_id@t<temp>.
  smoke_38flash_t0:
    <<: *smoke
    overrides: *gemini3_throttle
    model: flash38_model
  smoke_38flash_t1:
    <<: *smoke
    overrides: *gemini3_throttle
    model: flash38_model
    temperature: 1.0
  smoke_31pro_t0:
    <<: *smoke
    overrides: *gemini3_throttle
    model: pro31_model
  smoke_31pro_t1:
    <<: *smoke
    overrides: *gemini3_throttle
    model: pro31_model
    temperature: 1.0
  night1_38flash:
    <<: *night1
    overrides: *gemini3_throttle
    model: flash38_model
  night1_31pro:
    <<: *night1
    overrides: *gemini3_throttle
    model: pro31_model
  # Day 3 (PREREGISTRATION_DAY3.md, approved 2026-10-27): dual-target and subtle attacks (src/dual_attacks.py).
  # Same task pairs and repeats as night1; no new baselines. Smoke: 2 pairs x 3 variants per agent (not counted).
  smoke_day3_flash: &smoke_day3
    suites: [banking, slack]
    attacks: [dual_reviewer_note, dual_cover_story, subtle_account_note]
    repeats: 1
    baseline_count: 0
    pairs:
      - {suite: banking, user_task: user_task_0, injection_task: injection_task_0}
      - {suite: slack, user_task: user_task_1, injection_task: injection_task_1}
  smoke_day3_pro:
    <<: *smoke_day3
    model: pro_model
  night2_flash: &night2
    <<: *night1
    attacks: [dual_reviewer_note, dual_cover_story, subtle_account_note]
    baseline_count: 0
  night2_pro:
    <<: *night2
    model: pro_model
  # Scale-up (PREREGISTRATION_SCALEUP.md, approved 2026-11-03). Stage 0 smoke: one pair for each of the first 5
  # injection tasks per suite (deviation 2), plus 1 baseline per suite. Not counted.
  smoke_scaleup_flash: &smoke_scaleup
    suites: [travel, workspace]
    attacks: [important_instructions]
    repeats: 1
    baseline_count: 2  # round-robin over suites -> user_task_0 of each
    pairs:
      - {suite: travel, user_task: user_task_16, injection_task: injection_task_0}
      - {suite: travel, user_task: user_task_1, injection_task: injection_task_1}
      - {suite: travel, user_task: user_task_16, injection_task: injection_task_2}
      - {suite: travel, user_task: user_task_1, injection_task: injection_task_3}
      - {suite: travel, user_task: user_task_16, injection_task: injection_task_4}
      - {suite: workspace, user_task: user_task_30, injection_task: injection_task_0}
      - {suite: workspace, user_task: user_task_34, injection_task: injection_task_1}
      - {suite: workspace, user_task: user_task_0, injection_task: injection_task_2}
      - {suite: workspace, user_task: user_task_35, injection_task: injection_task_3}
      - {suite: workspace, user_task: user_task_30, injection_task: injection_task_4}
  smoke_scaleup_pro:
    <<: *smoke_scaleup
    model: pro_model
  # Stage 1: default k = 10 per injection task (210 pairs); k may only be lowered by the §3 size rule.
  scaleup_flash: &scaleup
    suites: [travel, workspace]
    attacks: [important_instructions, dual_reviewer_note, dual_cover_story]
    repeats: 1
    baseline_count: 20  # 10 per suite
    sampling: {rule: stratified_per_injection, k: {travel: 10, workspace: 10}, seed: 0}
  scaleup_pro:
    <<: *scaleup
    model: pro_model
  # Stage 2 real runs: the best 3 dev-set candidates as attack templates (src/dual_attacks.py TUNED_TEXTS) on the
  # Night 1 banking + Slack pairs (61) x 2 agents, 1 repeat = 366 runs; no baselines.
  tuned_flash: &tuned
    <<: *night1
    attacks: [tuned_r1c02, tuned_r1c09, tuned_r2c02]
    repeats: 1
    baseline_count: 0
  tuned_pro:
    <<: *tuned
    model: pro_model

# Day 2: LLM judges over the frozen Day 1 dataset (src/judge_runner.py). See PREREGISTRATION.md (approved 2026-10-24).
judging:
  dataset: night1_v1
  prompt_version: judge-v1
  judge_spend_cap_usd: 95.0  # scale-up Stage 3 (was 80.0); cumulative over all data/judgements lines
  concurrency: 4
  temperature: 0.0
  seed: 1234
  request_timeout_s: 300
  retry: {max_tries: 8, base_delay_s: 5.0, max_delay_s: 120.0}
  judges:
    frontier_gemini31pro:
      kind: gemini
      model: gemini-3.1-pro-preview  # location from vertex.model_locations (global); thinking at default, no cap
      prompt: judge-v1
      levels: [L1, L2, L3]
      est_output_tokens: 800  # dry-run estimate only (thinking + verdict)
    openweight_llama4:
      kind: openai_compat
      model: meta/llama-4-maverick-17b-128e-instruct-maas
      region: us-east5
      prompt: judge-v1
      levels: [L1, L2, L3]
      max_tokens: 512
      est_output_tokens: 120
    strong_gptoss:  # scale-up Stage 3 (PREREGISTRATION_SCALEUP.md §5 note, 2026-11-11); L2 only
      kind: openai_compat
      model: openai/gpt-oss-120b-maas
      region: us-central1
      prompt: judge-v1
      levels: [L2]
      max_tokens: 4096  # reasoning model: its reasoning tokens count towards max_tokens
      est_output_tokens: 700
    tool_promptfoo:
      kind: gemini
      model: gemini-2.5-flash
      prompt: promptfoo-ipi-0.125.0
      levels: [PF]  # promptfoo default view: final reply + injection goal + purpose; attacked runs only
      est_output_tokens: 600
  plans:
    judge_smoke:
      sample: {compromised: 4, seen_resisted: 3, never_exposed: 1, baseline: 1, secondary_resisted: 1, seed: 0}
      repeats: 1
    judge_full:
      repeats: 2
    judge_day3:  # PREREGISTRATION_DAY3.md: frozen Day 3 runs, repeat 0 only
      dataset: night2_v1
      repeats: 1
    judge_scaleup_smoke:  # PREREGISTRATION_SCALEUP.md Stage 0; log moved to data/judgements_smoke/ afterwards
      dataset: scaleup_smoke
      repeats: 1
      levels: [L1, L2, PF]
    judge_scaleup:  # Stage 1: L3 dropped
      dataset: scaleup_v1
      repeats: 1
      levels: [L1, L2, PF]
    judge_tuned:  # Stage 2 real runs, judged like Stage 1
      dataset: scaleup_tuned_v1
      repeats: 1
      levels: [L1, L2, PF]
    # Stage 3: second strong judge, L2, primary agents, compromised + seen-and-resisted runs (run with --judges strong_gptoss)
    judge_s3_smoke:
      dataset: night1_v1
      sample: {compromised: 10, seen_resisted: 10, seed: 0}
      repeats: 1
      levels: [L2]
    judge_s3_night1: &s3
      dataset: night1_v1
      buckets: [compromised, seen_resisted]
      repeats: 1
      levels: [L2]
    judge_s3_night2:
      <<: *s3
      dataset: night2_v1
    judge_s3_scaleup:
      <<: *s3
      dataset: scaleup_v1
    judge_s3_tuned:  # deviation 6: exploratory
      <<: *s3
      dataset: scaleup_tuned_v1
